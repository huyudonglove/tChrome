name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tool wiring check
        run: bun run check:wiring

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        # Full suite, not `bun test service shared`: the narrower form left the
        # browser-side specs unguarded, so a regression there would pass CI.
        run: bun test

      - name: Build extension
        run: bun run scripts/build-extension.ts

      - name: Context examples in sync
        run: bun run scripts/sync-context-examples.ts --check
